<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Guitar Tuner</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app {
      width: min(92vw, 520px);
      text-align: center;
      padding: 30px 10px;
    }

    h1 {
      margin-bottom: 10px;
    }

    select, button {
      font-size: 16px;
      padding: 12px;
      margin: 8px;
      border-radius: 8px;
      border: none;
    }

    button {
      cursor: pointer;
      font-weight: bold;
    }

    .note {
      font-size: 90px;
      font-weight: bold;
      margin-top: 25px;
    }

    .freq {
      font-size: 20px;
      opacity: 0.8;
      margin-bottom: 20px;
    }

    .meter {
      position: relative;
      height: 120px;
      margin: 25px 0 10px;
      background: #222;
      border-radius: 16px;
      overflow: hidden;
    }

    .center-line {
      position: absolute;
      left: 50%;
      top: 0;
      width: 3px;
      height: 100%;
      background: white;
      transform: translateX(-50%);
    }

    .needle {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 4px;
      height: 100px;
      background: #ffcc00;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(0deg);
      transition: transform 0.08s linear;
    }

    .labels {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      opacity: 0.7;
      padding: 0 5px;
    }

    .status {
      font-size: 28px;
      font-weight: bold;
      min-height: 40px;
      margin-top: 20px;
    }

    .strings {
      margin-top: 20px;
      font-size: 20px;
      letter-spacing: 5px;
    }

    .small {
      opacity: 0.7;
      font-size: 14px;
      margin-top: 20px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="app">
    <h1>Guitar Tuner</h1>

    <select id="tuningSelect">
      <option value="standard">Standard</option>
      <option value="dropD">Drop D</option>
      <option value="halfStep">Half-Step Down</option>
      <option value="dStandard">D Standard</option>
      <option value="dropC">Drop C</option>
    </select>

    <br>

    <button id="startButton">Start Tuner</button>

    <div class="note" id="note">--</div>
    <div class="freq" id="frequency">0.00 Hz</div>

    <div class="meter">
      <div class="center-line"></div>
      <div class="needle" id="needle"></div>
    </div>

    <div class="labels">
      <span>FLAT</span>
      <span>IN TUNE</span>
      <span>SHARP</span>
    </div>

    <div class="status" id="status">Press Start</div>
    <div class="strings" id="strings">E A D G B E</div>

    <div class="small">
      Play one string at a time.<br>
      Best results: use a quiet room and let the note ring clearly.
    </div>
  </div>

<script>
const tunings = {
  standard: [
    { note: "E2", freq: 82.4069 },
    { note: "A2", freq: 110.0000 },
    { note: "D3", freq: 146.8324 },
    { note: "G3", freq: 195.9977 },
    { note: "B3", freq: 246.9417 },
    { note: "E4", freq: 329.6276 }
  ],

  dropD: [
    { note: "D2", freq: 73.4162 },
    { note: "A2", freq: 110.0000 },
    { note: "D3", freq: 146.8324 },
    { note: "G3", freq: 195.9977 },
    { note: "B3", freq: 246.9417 },
    { note: "E4", freq: 329.6276 }
  ],

  halfStep: [
    { note: "Eb2", freq: 77.7817 },
    { note: "Ab2", freq: 103.8262 },
    { note: "Db3", freq: 138.5913 },
    { note: "Gb3", freq: 184.9972 },
    { note: "Bb3", freq: 233.0819 },
    { note: "Eb4", freq: 311.1270 }
  ],

  dStandard: [
    { note: "D2", freq: 73.4162 },
    { note: "G2", freq: 97.9989 },
    { note: "C3", freq: 130.8128 },
    { note: "F3", freq: 174.6141 },
    { note: "A3", freq: 220.0000 },
    { note: "D4", freq: 293.6648 }
  ],

  dropC: [
    { note: "C2", freq: 65.4064 },
    { note: "G2", freq: 97.9989 },
    { note: "C3", freq: 130.8128 },
    { note: "F3", freq: 174.6141 },
    { note: "A3", freq: 220.0000 },
    { note: "D4", freq: 293.6648 }
  ]
};

const tuningSelect = document.getElementById("tuningSelect");
const noteDisplay = document.getElementById("note");
const frequencyDisplay = document.getElementById("frequency");
const needle = document.getElementById("needle");
const statusDisplay = document.getElementById("status");
const stringsDisplay = document.getElementById("strings");
const startButton = document.getElementById("startButton");

let audioContext;
let analyser;
let microphone;
let buffer;
let running = false;

function updateStrings() {
  const tuning = tunings[tuningSelect.value];
  stringsDisplay.textContent = tuning.map(x => x.note.replace(/[0-9]/g, "")).join(" ");
}

tuningSelect.addEventListener("change", updateStrings);
updateStrings();

startButton.addEventListener("click", async () => {
  if (running) return;

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }
    });

    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioContext.createAnalyser();

    analyser.fftSize = 4096;
    buffer = new Float32Array(analyser.fftSize);

    microphone = audioContext.createMediaStreamSource(stream);
    microphone.connect(analyser);

    running = true;
    startButton.textContent = "Listening...";
    statusDisplay.textContent = "Play a string";

    detectPitch();

  } catch (err) {
    console.error(err);
    statusDisplay.textContent = "Microphone permission denied";
  }
});

function detectPitch() {
  if (!running) return;

  analyser.getFloatTimeDomainData(buffer);

  const frequency = autoCorrelate(buffer, audioContext.sampleRate);

  if (frequency !== -1 && frequency > 55 && frequency < 400) {
    const target = findClosestTarget(frequency);

    const cents = 1200 * Math.log2(frequency / target.freq);

    noteDisplay.textContent = target.note;
    frequencyDisplay.textContent = frequency.toFixed(2) + " Hz";

    const clamped = Math.max(-50, Math.min(50, cents));
    const angle = clamped * 1.2;

    needle.style.transform =
      `translateX(-50%) rotate(${angle}deg)`;

    if (Math.abs(cents) <= 5) {
      statusDisplay.textContent = "✓ IN TUNE";
    } else if (cents < 0) {
      statusDisplay.textContent =
        `${Math.abs(cents).toFixed(0)} cents flat — tighten`;
    } else {
      statusDisplay.textContent =
        `${Math.abs(cents).toFixed(0)} cents sharp — loosen`;
    }

  } else {
    noteDisplay.textContent = "--";
    frequencyDisplay.textContent = "0.00 Hz";
    statusDisplay.textContent = "Play a string";
  }

  requestAnimationFrame(detectPitch);
}

function findClosestTarget(freq) {
  const tuning = tunings[tuningSelect.value];

  let closest = tuning[0];
  let smallestDistance = Infinity;

  for (const target of tuning) {
    const distance = Math.abs(
      1200 * Math.log2(freq / target.freq)
    );

    if (distance < smallestDistance) {
      smallestDistance = distance;
      closest = target;
    }
  }

  return closest;
}

function autoCorrelate(buf, sampleRate) {
  const SIZE = buf.length;

  let rms = 0;

  for (let i = 0; i < SIZE; i++) {
    const val = buf[i];
    rms += val * val;
  }

  rms = Math.sqrt(rms / SIZE);

  if (rms < 0.01) {
    return -1;
  }

  let r1 = 0;
  let r2 = SIZE - 1;
  const threshold = 0.2;

  for (let i = 0; i < SIZE / 2; i++) {
    if (Math.abs(buf[i]) < threshold) {
      r1 = i;
      break;
    }
  }

  for (let i = 1; i < SIZE / 2; i++) {
    if (Math.abs(buf[SIZE - i]) < threshold) {
      r2 = SIZE - i;
      break;
    }
  }

  const trimmed = buf.slice(r1, r2);
  const newSize = trimmed.length;

  const correlations = new Array(newSize).fill(0);

  for (let lag = 0; lag < newSize; lag++) {
    for (let i = 0; i < newSize - lag; i++) {
      correlations[lag] += trimmed[i] * trimmed[i + lag];
    }
  }

  let dip = 0;

  while (
    dip + 1 < newSize &&
    correlations[dip] > correlations[dip + 1]
  ) {
    dip++;
  }

  let maxValue = -1;
  let maxIndex = -1;

  for (let i = dip; i < newSize; i++) {
    if (correlations[i] > maxValue) {
      maxValue = correlations[i];
      maxIndex = i;
    }
  }

  if (maxIndex <= 0) {
    return -1;
  }

  let period = maxIndex;

  if (
    maxIndex > 0 &&
    maxIndex < correlations.length - 1
  ) {
    const x1 = correlations[maxIndex - 1];
    const x2 = correlations[maxIndex];
    const x3 = correlations[maxIndex + 1];

    const denominator = (x1 - 2 * x2 + x3);

    if (denominator !== 0) {
      period =
        maxIndex +
        0.5 * (x1 - x3) / denominator;
    }
  }

  return sampleRate / period;
}
</script>
</body>
</html>
